name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      AGENT_API_KEY: ci-dummy-key
      REDIS_URL: fake://
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline tests
        run: >-
          pytest tests/
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"

      - name: Wait for rollout
        run: sleep 45

      - name: Smoke test
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: curl --fail --silent --show-error "$PUBLIC_URL/health"
